[build]
builder = "nixpacks"

# Concurrency for ~20 users: override via Railway variables if needed, e.g.
# GUNICORN_WORKERS=2 GUNICORN_THREADS=6 DB_POOL_SIZE=6 DB_POOL_MAX_OVERFLOW=8
[deploy]
startCommand = "sh start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.envs]
FLASK_ENV = "production"


