[build]
builder = "nixpacks"

[deploy]
startCommand = "/opt/venv/bin/gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180 --preload"
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.envs]
FLASK_ENV = "production"


