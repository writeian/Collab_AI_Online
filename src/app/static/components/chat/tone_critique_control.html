<!-- Tone & Length Control Component -->
<details class="mt-4">
  <summary class="cursor-pointer text-sm font-medium text-muted-foreground hover:text-foreground">
    Tone & Length
  </summary>
  <div class="mt-3 p-3 bg-muted rounded-md text-xs space-y-4">
    <div class="space-y-3">
      <div class="flex items-center justify-between gap-2">
        <span class="inline-flex items-center gap-1">
          <span class="font-medium">Style</span>
          <button type="button"
                  class="inline-flex h-4 min-w-4 shrink-0 items-center justify-center rounded-full border border-border bg-background px-0.5 text-[10px] font-semibold leading-none text-muted-foreground hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1 focus-visible:ring-offset-background"
                  title="Adjust how tough or gentle the AI's feedback is."
                  aria-label="Tip: Style — adjust how tough or gentle the AI's feedback is.">?</button>
        </span>
        <span id="critique-label" class="text-muted-foreground">Balanced</span>
      </div>

      <!-- 5-step slider: 1 = Very Supportive … 5 = Very Critical -->
      <input id="critique-slider"
             type="range"
             min="1" max="5" step="1"
             value="3"
             class="w-full"
             aria-label="AI critique level slider">

      <div class="flex justify-between text-[11px] text-muted-foreground">
        <span>Supportive</span>
        <span>Balanced</span>
        <span>Critical</span>
      </div>
    </div>

    <div class="space-y-2 border-t border-border pt-3">
      <div class="inline-flex items-center gap-1">
        <span class="font-medium">Length</span>
        <button type="button"
                class="inline-flex h-4 min-w-4 shrink-0 items-center justify-center rounded-full border border-border bg-background px-0.5 text-[10px] font-semibold leading-none text-muted-foreground hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1 focus-visible:ring-offset-background"
                title="Short is a few bullets; Medium mixes brevity and detail; Long matches our usual full answers."
                aria-label="Tip: Length — Short is a few bullets; Medium mixes brevity and detail; Long matches our usual full answers.">?</button>
      </div>
      <div class="flex gap-2" role="group" aria-label="Response length">
        <button type="button"
                class="response-length-btn flex-1 min-h-9 box-border rounded-md border-2 px-2 py-1.5 text-[11px] font-medium bg-background shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1 focus-visible:ring-offset-background"
                data-length="short"
                aria-pressed="false">
          Short
        </button>
        <button type="button"
                class="response-length-btn flex-1 min-h-9 box-border rounded-md border-2 px-2 py-1.5 text-[11px] font-medium bg-background shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1 focus-visible:ring-offset-background"
                data-length="medium"
                aria-pressed="true">
          Medium
        </button>
        <button type="button"
                class="response-length-btn flex-1 min-h-9 box-border rounded-md border-2 px-2 py-1.5 text-[11px] font-medium bg-background shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1 focus-visible:ring-offset-background"
                data-length="long"
                aria-pressed="false">
          Long
        </button>
      </div>
    </div>
  </div>
</details>

<!-- Script moved to injection handler to avoid innerHTML execution issues -->
