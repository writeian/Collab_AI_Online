<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Collab Online{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- New Design System CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/globals.css') }}?v=1.1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v=1.1">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- Your existing styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=1.1">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-background text-foreground">
    <!-- Navigation Header -->
    <header class="bg-card border-b border-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo and Title -->
                <div class="flex items-center">
                    <a href="{{ url_for('room.index') }}" class="text-2xl font-bold text-foreground hover:text-primary transition-colors">
                        AI Collab
                    </a>
                </div>
                
                <!-- Navigation Links -->
                <nav class="flex items-center space-x-8">
                    {% if user %}
                        <a href="{{ url_for('room.index') }}" class="text-primary hover:text-primary/80 transition-colors relative">
                            Home
                            {% if invitation_count > 0 %}
                            <span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold">
                                {{ invitation_count }}
                            </span>
                            {% endif %}
                        </a>
                        <a href="{{ url_for('dashboard.index') }}" class="text-muted-foreground hover:text-foreground transition-colors">Dashboard</a>
                        <a href="{{ url_for('auth.profile') }}" class="text-muted-foreground hover:text-foreground transition-colors">Profile</a>
                        <a href="{{ url_for('auth.logout') }}" class="text-muted-foreground hover:text-foreground transition-colors">Logout</a>
                    {% else %}
                        <a href="{{ url_for('auth.login') }}" class="text-muted-foreground hover:text-foreground transition-colors">Login</a>
                        <a href="{{ url_for('auth.register') }}" class="text-muted-foreground hover:text-foreground transition-colors">Register</a>
                    {% endif %}
                    <a href="{{ url_for('about') }}" class="text-muted-foreground hover:text-foreground transition-colors">About</a>
                </nav>
            </div>
        </div>
    </header>

    {% block content %}{% endblock %}
    
    <!-- Initialize Lucide icons -->
    <script>
        lucide.createIcons();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
