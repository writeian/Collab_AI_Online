<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Collab – {% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2" />
    
    <!-- Simple Analytics -->
    <script>
      // Track page views
      fetch('/analytics/pageview', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          page: window.location.pathname,
          user_agent: navigator.userAgent,
          timestamp: new Date().toISOString()
        })
      }).catch(err => console.log('Analytics error:', err));
    </script>
  </head>
  <body>
    <div class="container">
      <h1><a href="{{ url_for('room.index') }}" style="text-decoration:none; color:inherit">AI Collab</a></h1>
      <nav>
        <a href="{{ url_for('room.index') }}">All Rooms</a>
        {% if user %}
          <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
          <a href="{{ url_for('auth.logout') }}">Logout</a>
        {% else %}
          <a href="{{ url_for('auth.login') }}">Login</a>
          <a href="{{ url_for('auth.register') }}">Register</a>
        {% endif %}
        <a href="{{ url_for('about') }}">About</a>
      </nav>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-messages">
            {% for category, msg in messages %}
              <div class="flash flash-{{ category if category != 'message' else 'info' }}">
                {{ msg }}
                <button class="flash-close" onclick="this.parentElement.remove()">&times;</button>
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>
  </body>
</html>
