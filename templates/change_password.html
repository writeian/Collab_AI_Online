{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
  <!-- Main Content Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Page Header -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-foreground mb-2">Change Password</h1>
      <p class="text-muted-foreground">Update your account password</p>
    </div>

    <!-- Change Password Form Card -->
    <div class="max-w-md mx-auto">
      <div class="bg-card border border-border rounded-lg p-8">
        <form method="post" class="space-y-6">
          <div class="form-group">
            <label for="current_password" class="block text-sm font-medium text-foreground mb-2">Current Password</label>
            <input type="password" id="current_password" name="current_password" required
                   class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                          focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                          placeholder:text-muted-foreground">
          </div>

          <div class="form-group">
            <label for="new_password" class="block text-sm font-medium text-foreground mb-2">New Password</label>
            <input type="password" id="new_password" name="new_password" required
                   class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                          focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                          placeholder:text-muted-foreground">
            <p class="mt-2 text-sm text-muted-foreground">At least 6 characters</p>
          </div>

          <div class="form-group">
            <label for="confirm_password" class="block text-sm font-medium text-foreground mb-2">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required
                   class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                          focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                          placeholder:text-muted-foreground">
          </div>

          <button type="submit" 
                  class="w-full px-4 py-2 bg-primary text-primary-foreground rounded-md hover:bg-primary/90 
                         transition-colors font-medium">
            Update Password
          </button>
        </form>
        
        <div class="mt-6 text-center">
          <p><a href="{{ url_for('auth.profile') }}" class="text-primary hover:text-primary/80 text-sm">← Back to Profile</a></p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
