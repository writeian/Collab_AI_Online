{% extends "base.html" %}
{% block title %}Edit Room{% endblock %}
{% block content %}
  <!-- Navigation Breadcrumb -->
  <div class="navigation-breadcrumb">
    <a href="{{ url_for('room.index') }}" class="breadcrumb-link">
      <i data-lucide="home" class="w-4 h-4"></i>
      Home
    </a>
    <span class="breadcrumb-separator">/</span>
    <a href="{{ url_for('room.view_room', room_id=room.id) }}" class="breadcrumb-link">
      <i data-lucide="users" class="w-4 h-4"></i>
      {{ room.name }}
    </a>
    <span class="breadcrumb-separator">/</span>
    <span class="breadcrumb-current">Edit</span>
  </div>

  <h2>Edit Room: {{ room.name }}</h2>
  
  <form method="POST">
    <div class="form-group">
      <label for="name">Room Name *</label>
      <input type="text" id="name" name="name" value="{{ room.name }}" required class="form-control">
    </div>
    
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" class="form-control" rows="3" placeholder="What is this room for?">{{ room.description or '' }}</textarea>
    </div>
    
    <div class="form-group">
      <label for="goals">Learning Goals</label>
      <textarea id="goals" name="goals" class="form-control" rows="3" placeholder="What should students learn in this room?">{{ room.goals or '' }}</textarea>
    </div>
    
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Update Room</button>
      <a href="{{ url_for('room.view_room', room_id=room.id) }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
{% endblock %}
