{% extends "base.html" %}
{% block title %}Create Room{% endblock %}
{% block content %}
  <h2>Create New Room</h2>
  
  <form method="POST">
    <div class="form-group">
      <label for="name">Room Name *</label>
      <input type="text" id="name" name="name" required class="form-control">
    </div>
    
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" class="form-control" rows="3" placeholder="What is this room for?"></textarea>
    </div>
    
    <div class="form-group">
      <label for="goals">Learning Goals</label>
      <textarea id="goals" name="goals" class="form-control" rows="3" placeholder="What should students learn in this room?"></textarea>
    </div>
    
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create Room</button>
      <a href="{{ url_for('room.index') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
{% endblock %}
