{% extends "base.html" %}
{% block title %}Create Chat{% endblock %}
{% block content %}
  <!-- Main Content Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Page Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-foreground mb-2">Create New Chat in: {{ room.name }}</h1>
      <p class="text-muted-foreground">Start a new conversation with AI assistance</p>
    </div>

    <!-- Create Chat Form Card -->
    <div class="max-w-2xl mx-auto">
      <div class="bg-card border border-border rounded-lg p-8">
        <form method="POST" id="createChatForm" class="space-y-6">
          <div class="form-group">
            <label for="title" class="block text-sm font-medium text-foreground mb-2">Chat Title *</label>
            <input type="text" id="title" name="title" required 
                   placeholder="Enter chat title"
                   class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                          focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                          placeholder:text-muted-foreground">
          </div>
          
          <div class="form-group">
            <label for="mode" class="block text-sm font-medium text-foreground mb-2">Learning Step</label>
            <select id="mode" name="mode" 
                    class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                           focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
              {% set sorted_modes = [] %}
              {% for mode_key, mode_info in modes.items() %}
                {% set mode_number = mode_info.label.split('.')[0] if '.' in mode_info.label else '999' %}
                {% set mode_number_int = mode_number|int if mode_number.isdigit() else 999 %}
                {% set _ = sorted_modes.append((mode_number_int, mode_key, mode_info)) %}
              {% endfor %}
              {% for sort_order, mode_key, mode_info in sorted_modes|sort %}
                <option value="{{ mode_key }}">{{ mode_info.label }}</option>
              {% endfor %}
            </select>
          </div>
          
          <div class="form-group">
            <label for="google_doc_url" class="block text-sm font-medium text-foreground mb-2">Google Doc URL (Optional)</label>
            <input type="url" id="google_doc_url" name="google_doc_url" 
                   placeholder="https://docs.google.com/document/d/..."
                   class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                          focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                          placeholder:text-muted-foreground">
            <p class="mt-2 text-sm text-muted-foreground">Paste a Google Doc URL to import its content into the chat</p>
          </div>
          
          <div class="flex gap-3 pt-4">
            <button type="submit" id="createButton"
                    class="flex-1 px-4 py-2 bg-success text-white rounded-md hover:bg-success-hover 
                           transition-colors font-medium">
              Create Chat
            </button>
            <a href="{{ url_for('room.room_crud.view_room', room_id=room.id) }}" 
               class="px-4 py-2 bg-white text-black border border-gray-300 rounded-md hover:bg-gray-50 
                      transition-colors font-medium text-center">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <script>
    document.getElementById('createChatForm').addEventListener('submit', function(e) {
      const button = document.getElementById('createButton');
      loadingManager.setLoading(button, 'Creating Chat...');
    });

    // Auto-populate chat title with selected mode
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded, setting up auto-populate...');
      
      const modeSelect = document.getElementById('mode');
      const titleInput = document.getElementById('title');
      
      console.log('Mode select found:', modeSelect);
      console.log('Title input found:', titleInput);
      
      if (!modeSelect || !titleInput) {
        console.error('Could not find mode select or title input');
        return;
      }
      
      // Function to update title based on selected mode
      function updateTitleFromMode() {
        const selectedOption = modeSelect.options[modeSelect.selectedIndex];
        console.log('Mode changed to:', selectedOption ? selectedOption.text : 'none');
        
        if (selectedOption) {
          const modeLabel = selectedOption.text;
          console.log('Updating title to:', modeLabel);
          
          // Only update if title is empty or matches a previous mode suggestion
          if (!titleInput.value || 
              titleInput.value.includes('Mode') || 
              titleInput.value.includes('Step') ||
              titleInput.value.includes('.')) {
            titleInput.value = modeLabel;
            console.log('Title updated to:', titleInput.value);
          } else {
            console.log('Title not updated - user has custom text:', titleInput.value);
          }
        }
      }
      
      // Update title when mode changes
      modeSelect.addEventListener('change', function() {
        console.log('Mode change event triggered');
        updateTitleFromMode();
      });
      
      // Set initial title if page loads with a pre-selected mode
      if (modeSelect.value) {
        console.log('Setting initial title for mode:', modeSelect.value);
        updateTitleFromMode();
      }
      
      // Allow user to manually edit the title
      titleInput.addEventListener('input', function() {
        console.log('User is editing title:', titleInput.value);
        // User is manually editing, don't auto-update
        titleInput.dataset.userEdited = 'true';
      });
      
      // Reset user edited flag when mode changes
      modeSelect.addEventListener('change', function() {
        console.log('Resetting user edited flag');
        delete titleInput.dataset.userEdited;
      });
      
      console.log('Auto-populate setup complete');
    });
  </script>
{% endblock %}
