{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
  <!-- Main Content Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Page Header -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-foreground mb-2">Create Account</h1>
      <p class="text-muted-foreground">Join AI Collab and start collaborating with AI-powered writing</p>
    </div>

    <!-- Registration Form Card -->
    <div class="max-w-2xl mx-auto">
      <div class="bg-card border border-border rounded-lg p-8">
        <form method="post" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-group">
              <label for="username" class="block text-sm font-medium text-foreground mb-2">Username *</label>
              <input type="text" id="username" name="username" value="{{ username or '' }}" required 
                     class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                            focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                            placeholder:text-muted-foreground">
              <small class="text-xs text-muted-foreground mt-1">Letters, numbers, and underscores only</small>
            </div>

            <div class="form-group">
              <label for="email" class="block text-sm font-medium text-foreground mb-2">Email *</label>
              <input type="email" id="email" name="email" value="{{ email or '' }}" required 
                     class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                            focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                            placeholder:text-muted-foreground">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-group">
              <label for="full_name" class="block text-sm font-medium text-foreground mb-2">Full Name *</label>
              <input type="text" id="full_name" name="full_name" value="{{ full_name or '' }}" required 
                     class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                            focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                            placeholder:text-muted-foreground">
            </div>

            <div class="form-group">
              <label for="display_name" class="block text-sm font-medium text-foreground mb-2">Display Name *</label>
              <input type="text" id="display_name" name="display_name" value="{{ display_name or '' }}" required 
                     class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                            focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                            placeholder:text-muted-foreground">
            </div>
          </div>

          <div class="form-group">
            <label for="password" class="block text-sm font-medium text-foreground mb-2">Password *</label>
            <input type="password" id="password" name="password" required 
                   class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                          focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                          placeholder:text-muted-foreground">
            <small class="text-xs text-muted-foreground mt-1">At least 6 characters</small>
          </div>

          <div class="border-t border-border pt-6">
            <h3 class="text-lg font-semibold text-foreground mb-4">Optional Information</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="form-group">
                <label for="institution" class="block text-sm font-medium text-foreground mb-2">Institution/University</label>
                <input type="text" id="institution" name="institution" value="{{ institution or '' }}" 
                       class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                              focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                              placeholder:text-muted-foreground">
              </div>

              <div class="form-group">
                <label for="department" class="block text-sm font-medium text-foreground mb-2">Department/Field of Study</label>
                <input type="text" id="department" name="department" value="{{ department or '' }}" 
                       class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                              focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                              placeholder:text-muted-foreground">
              </div>
            </div>

            <div class="form-group">
              <label for="research_area" class="block text-sm font-medium text-foreground mb-2">Research Area</label>
              <input type="text" id="research_area" name="research_area" value="{{ research_area or '' }}" 
                     placeholder="e.g., Computer Science, Education, etc."
                     class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                            focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                            placeholder:text-muted-foreground">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="form-group">
                <label for="role" class="block text-sm font-medium text-foreground mb-2">Role</label>
                <select id="role" name="role" 
                        class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                               focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                  <option value="">Select your role</option>
                  <option value="Student" {{ 'selected' if role == 'Student' else '' }}>Student</option>
                  <option value="Professor" {{ 'selected' if role == 'Professor' else '' }}>Professor</option>
                  <option value="Researcher" {{ 'selected' if role == 'Researcher' else '' }}>Researcher</option>
                  <option value="Administrator" {{ 'selected' if role == 'Administrator' else '' }}>Administrator</option>
                  <option value="Other" {{ 'selected' if role == 'Other' else '' }}>Other</option>
                </select>
              </div>

              <div class="form-group">
                <label for="primary_use_case" class="block text-sm font-medium text-foreground mb-2">Primary Use Case</label>
                <select id="primary_use_case" name="primary_use_case" 
                        class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                               focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                  <option value="">Select primary use</option>
                  <option value="Research" {{ 'selected' if primary_use_case == 'Research' else '' }}>Research</option>
                  <option value="Teaching" {{ 'selected' if primary_use_case == 'Teaching' else '' }}>Teaching</option>
                  <option value="Personal Projects" {{ 'selected' if primary_use_case == 'Personal Projects' else '' }}>Personal Projects</option>
                  <option value="Other" {{ 'selected' if primary_use_case == 'Other' else '' }}>Other</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="form-group">
                <label for="team_size" class="block text-sm font-medium text-foreground mb-2">Expected Team Size</label>
                <select id="team_size" name="team_size" 
                        class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                               focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                  <option value="">Select team size</option>
                  <option value="Individual" {{ 'selected' if team_size == 'Individual' else '' }}>Individual</option>
                  <option value="Small Group (2-5)" {{ 'selected' if team_size == 'Small Group (2-5)' else '' }}>Small Group (2-5)</option>
                  <option value="Large Class (6+)" {{ 'selected' if team_size == 'Large Class (6+)' else '' }}>Large Class (6+)</option>
                </select>
              </div>

              <div class="form-group">
                <label for="heard_from" class="block text-sm font-medium text-foreground mb-2">How did you hear about us?</label>
                <select id="heard_from" name="heard_from" 
                        class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                               focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                  <option value="">Select option</option>
                  <option value="Colleague/Peer" {{ 'selected' if heard_from == 'Colleague/Peer' else '' }}>Colleague/Peer</option>
                  <option value="Conference/Event" {{ 'selected' if heard_from == 'Conference/Event' else '' }}>Conference/Event</option>
                  <option value="Social Media" {{ 'selected' if heard_from == 'Social Media' else '' }}>Social Media</option>
                  <option value="Search Engine" {{ 'selected' if heard_from == 'Search Engine' else '' }}>Search Engine</option>
                  <option value="Other" {{ 'selected' if heard_from == 'Other' else '' }}>Other</option>
                </select>
              </div>
            </div>

            <div class="form-group checkbox-group">
              <label class="flex items-center space-x-2">
                <input type="checkbox" name="agree_terms" required 
                       class="w-4 h-4 text-primary border-border rounded focus:ring-primary focus:ring-2">
                <span class="text-sm text-foreground">
                  I agree to the 
                  <a href="{{ url_for('about') }}" class="text-primary hover:text-primary/80 transition-colors">Terms of Service</a>
                  and 
                  <a href="{{ url_for('about') }}" class="text-primary hover:text-primary/80 transition-colors">Privacy Policy</a>
                </span>
              </label>
            </div>
          </div>

          <div class="flex items-center justify-between pt-6">
            <button type="submit" 
                    class="px-6 py-2 bg-primary text-primary-foreground rounded-md hover:bg-primary/90 
                           transition-colors font-medium">
              Create Account
            </button>
            <a href="{{ url_for('auth.login') }}" 
               class="text-sm text-muted-foreground hover:text-foreground transition-colors">
              Already have an account? Login
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
