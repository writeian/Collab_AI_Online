{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
  <div class="auth-container">
    <h2>Create Account</h2>
    
    <form method="post" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required>
        <small>Letters, numbers, and underscores only</small>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>
      </div>

      <div class="form-group">
        <label for="display_name">Display Name</label>
        <input type="text" id="display_name" name="display_name" value="{{ display_name or '' }}" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <small>At least 6 characters</small>
      </div>

      <button type="submit" class="btn-primary">Create Account</button>
    </form>
    
    <div class="auth-links">
      <p>Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
    </div>
  </div>
{% endblock %}
