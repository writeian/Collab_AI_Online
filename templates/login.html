{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
  <!-- Main Content Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Page Header -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-foreground mb-2">Login to AI Collab</h1>
      <p class="text-muted-foreground">Welcome back! Please sign in to your account</p>
    </div>

    <!-- Login Form Card -->
    <div class="max-w-md mx-auto">
      <div class="bg-card border border-border rounded-xl p-8 shadow-sm">
        <form method="post" class="space-y-6">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
          <div class="form-group">
            <label for="username" class="block text-sm font-medium text-foreground mb-2">Username</label>
            <input type="text" id="username" name="username" value="{{ username or '' }}" required 
                   class="w-full h-11 px-3 border border-border rounded-md bg-background text-foreground 
                          focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                          placeholder:text-muted-foreground">
          </div>

          <div class="form-group">
            <label for="password" class="block text-sm font-medium text-foreground mb-2">Password</label>
            <div class="relative">
              <input type="password" id="password" name="password" required 
                     class="w-full h-11 px-3 pr-10 border border-border rounded-md bg-background text-foreground 
                            focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                            placeholder:text-muted-foreground">
              <button type="button" id="toggle-password" aria-label="Show password"
                      class="absolute inset-y-0 right-0 px-3 text-muted-foreground hover:text-foreground">
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="login-submit"
                  class="w-full h-11 inline-flex items-center justify-center bg-primary text-primary-foreground rounded-md hover:bg-primary/90 
                         transition-colors font-medium">
            <span class="inline" id="login-text">Login</span>
            <i data-lucide="loader-2" class="w-4 h-4 animate-spin hidden" id="login-loading"></i>
          </button>
        </form>
        
        <div class="mt-6 text-center space-y-2">
          <p class="text-sm text-muted-foreground">
            Don't have an account? 
            <a href="{{ url_for('auth.register') }}" class="text-primary hover:text-primary/80 transition-colors">
              Register here
            </a>
          </p>
          <p class="text-sm text-muted-foreground">
            <a href="{{ url_for('auth.forgot_password') }}" class="text-primary hover:text-primary/80 transition-colors">
              Forgot your password?
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
  {% block extra_js %}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log('👁️ Login page loaded, setting up password toggle');
      
      const toggle = document.getElementById('toggle-password');
      const pwd = document.getElementById('password');
      
      console.log('👁️ Elements found:', { toggle: !!toggle, pwd: !!pwd });
      console.log('👁️ Lucide available:', !!window.lucide);
      
      if (toggle && pwd) {
        console.log('👁️ Adding click listener to password toggle');
        
        // Test if event listener is working
        toggle.onclick = function() {
          console.log('👁️ Password toggle clicked (onclick method)');
        };
        
        toggle.addEventListener('click', function() {
          console.log('👁️ Password toggle clicked (addEventListener)');
          
          const isText = pwd.type === 'text';
          console.log('👁️ Current type:', pwd.type, 'isText:', isText);
          
          // Force input type change with both methods
          const newType = isText ? 'password' : 'text';
          pwd.setAttribute('type', newType);
          pwd.type = newType;
          console.log('👁️ Changed type to:', pwd.type);
          
          this.setAttribute('aria-label', isText ? 'Show password' : 'Hide password');
          
          const icon = this.querySelector('svg, i');
          console.log('👁️ Icon found:', !!icon);
          
          if (icon) {
            const newIcon = isText ? 'eye' : 'eye-off';
            console.log('👁️ Changing icon to:', newIcon);
            
            // Replace with direct SVG instead of relying on Lucide
            if (isText) {
              // Show eye icon (password hidden)
              icon.outerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            } else {
              // Show eye-off icon (password visible)
              icon.outerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" x2="22" y1="2" y2="22"></line></svg>`;
            }
            
            console.log('👁️ Icon replaced with direct SVG');
          }
        });
        
        // Test button properties
        console.log('👁️ Button properties:', {
          disabled: toggle.disabled,
          style_pointerEvents: toggle.style.pointerEvents,
          style_display: toggle.style.display,
          offsetParent: !!toggle.offsetParent,
          getBoundingClientRect: toggle.getBoundingClientRect()
        });
        
        // Add visual indicator that button is interactive
        toggle.style.border = '2px solid red';
        toggle.title = 'DEBUG: Click me to toggle password';
        
        console.log('👁️ Password toggle setup complete');
      } else {
        console.error('👁️ Password toggle setup failed - missing elements');
      }

      const form = document.querySelector('form[method="post"]');
      const submitBtn = document.getElementById('login-submit');
      const textSpan = document.getElementById('login-text');
      const loadingIcon = document.getElementById('login-loading');
      if (form && submitBtn && textSpan && loadingIcon) {
        form.addEventListener('submit', function() {
          submitBtn.disabled = true;
          textSpan.classList.add('hidden');
          loadingIcon.classList.remove('hidden');
        });
      }
    });
  </script>
  {% endblock %}
{% endblock %}
