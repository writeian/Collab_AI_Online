{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
  <!-- Main Content Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Page Header -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-foreground mb-2">Reset Password</h1>
      <p class="text-muted-foreground">Enter your email to receive a password reset link</p>
    </div>

    <!-- Reset Password Form Card -->
    <div class="max-w-md mx-auto">
      <div class="bg-card border border-border rounded-lg p-8">
        <form method="post" class="space-y-6">
          <div class="form-group">
            <label for="email" class="block text-sm font-medium text-foreground mb-2">Email Address</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required
                   class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                          focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                          placeholder:text-muted-foreground">
            <p class="mt-2 text-sm text-muted-foreground">Enter the email address associated with your account</p>
          </div>

          <button type="submit" 
                  class="w-full px-4 py-2 bg-primary text-primary-foreground rounded-md hover:bg-primary/90 
                         transition-colors font-medium">
            Send Reset Link
          </button>
        </form>
        
        <div class="mt-6 text-center space-y-2">
          <p><a href="{{ url_for('auth.login') }}" class="text-primary hover:text-primary/80 text-sm">Back to Login</a></p>
          <p class="text-sm text-muted-foreground">
            Don't have an account? 
            <a href="{{ url_for('auth.register') }}" class="text-primary hover:text-primary/80">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
