{% extends "base.html" %}
{% block title %}Edit Chat{% endblock %}
{% block content %}
  <!-- Main Content Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Navigation Breadcrumb -->
    <div class="navigation-breadcrumb">
      <a href="{{ url_for('room.index') }}" class="breadcrumb-link">
        <i data-lucide="home" class="w-4 h-4"></i>
        Home
      </a>
      <span class="breadcrumb-separator">/</span>
      <a href="{{ url_for('room.view_room', room_id=chat.room_id) }}" class="breadcrumb-link">
        <i data-lucide="users" class="w-4 h-4"></i>
        {{ chat.room.name }}
      </a>
      <span class="breadcrumb-separator">/</span>
      <a href="{{ url_for('chat.view_chat', chat_id=chat.id) }}" class="breadcrumb-link">
        <i data-lucide="message-circle" class="w-4 h-4"></i>
        {{ chat.title }}
      </a>
      <span class="breadcrumb-separator">/</span>
      <span class="breadcrumb-current">Edit</span>
    </div>

    <!-- Page Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-foreground mb-2">Edit Chat</h1>
      <p class="text-muted-foreground">Update your chat settings and configuration</p>
    </div>

    <!-- Edit Form Card -->
    <div class="bg-card border border-border rounded-lg p-6 max-w-2xl">
      <form method="POST" class="space-y-6">
        <div class="form-group">
          <label for="title" class="block text-sm font-medium text-foreground mb-2">Chat Title *</label>
          <input type="text" id="title" name="title" value="{{ chat.title }}" required 
                 class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                        focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                        placeholder:text-muted-foreground">
        </div>
        
        <div class="form-group">
          <label for="mode" class="block text-sm font-medium text-foreground mb-2">Writing Mode</label>
          <select id="mode" name="mode" 
                  class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                         focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            {% for mode_key, mode_info in modes.items()|sort(attribute='1.label') %}
              <option value="{{ mode_key }}" {% if chat.mode == mode_key %}selected{% endif %}>
                {{ mode_info.label }}
              </option>
            {% endfor %}
          </select>
        </div>
        
        <div class="form-actions flex items-center gap-4 pt-4">
          <button type="submit" 
                  class="px-4 py-2 bg-primary text-primary-foreground rounded-md hover:bg-primary/90 
                         transition-colors font-medium">
            Update Chat
          </button>
          <a href="{{ url_for('chat.view_chat', chat_id=chat.id) }}" 
             class="px-4 py-2 border border-border rounded-md text-foreground hover:bg-muted 
                    transition-colors font-medium">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
