{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
  <!-- Main Content Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Page Header -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-foreground mb-2">Edit Profile</h1>
      <p class="text-muted-foreground">Update your account information and preferences</p>
    </div>

    <!-- Edit Profile Form Card -->
    <div class="max-w-2xl mx-auto">
      <div class="bg-card border border-border rounded-lg p-8">
        <form method="post" class="space-y-8">
          <!-- Personal Information Section -->
          <div>
            <h3 class="text-lg font-semibold text-foreground mb-4">Personal Information</h3>
            <div class="space-y-4">
              <div class="form-group">
                <label for="full_name" class="block text-sm font-medium text-foreground mb-2">Full Name</label>
                <input type="text" id="full_name" name="full_name" value="{{ user.full_name or '' }}"
                       class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                              focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                              placeholder:text-muted-foreground">
              </div>

              <div class="form-group">
                <label for="display_name" class="block text-sm font-medium text-foreground mb-2">Display Name *</label>
                <input type="text" id="display_name" name="display_name" value="{{ user.display_name }}" required
                       class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                              focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                              placeholder:text-muted-foreground">
              </div>

              <div class="form-group">
                <label for="bio" class="block text-sm font-medium text-foreground mb-2">Bio</label>
                <textarea id="bio" name="bio" rows="3" placeholder="Tell us about yourself..."
                          class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                                 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                                 placeholder:text-muted-foreground resize-vertical">{{ user.bio or '' }}</textarea>
              </div>
            </div>
          </div>

          <!-- Professional Information Section -->
          <div>
            <h3 class="text-lg font-semibold text-foreground mb-4">Professional Information</h3>
            <div class="space-y-4">
              <div class="form-group">
                <label for="organization" class="block text-sm font-medium text-foreground mb-2">Organization</label>
                <input type="text" id="organization" name="organization" value="{{ user.organization or '' }}"
                       class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                              focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent
                              placeholder:text-muted-foreground">
              </div>

              <div class="form-group">
                <label for="role" class="block text-sm font-medium text-foreground mb-2">Role</label>
                <select id="role" name="role"
                        class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                               focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                  <option value="">Select your role...</option>
                  <option value="educator" {{ 'selected' if user.role == 'educator' else '' }}>Educator</option>
                  <option value="student" {{ 'selected' if user.role == 'student' else '' }}>Student</option>
                  <option value="researcher" {{ 'selected' if user.role == 'researcher' else '' }}>Researcher</option>
                  <option value="professional" {{ 'selected' if user.role == 'professional' else '' }}>Professional</option>
                  <option value="other" {{ 'selected' if user.role == 'other' else '' }}>Other</option>
                </select>
              </div>

              <div class="form-group">
                <label for="primary_use_case" class="block text-sm font-medium text-foreground mb-2">Primary Use Case</label>
                <select id="primary_use_case" name="primary_use_case"
                        class="w-full px-3 py-2 border border-border rounded-md bg-background text-foreground 
                               focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                  <option value="">Select primary use case...</option>
                  <option value="academic_writing" {{ 'selected' if user.primary_use_case == 'academic_writing' else '' }}>Academic Writing</option>
                  <option value="creative_writing" {{ 'selected' if user.primary_use_case == 'creative_writing' else '' }}>Creative Writing</option>
                  <option value="business_writing" {{ 'selected' if user.primary_use_case == 'business_writing' else '' }}>Business Writing</option>
                  <option value="technical_writing" {{ 'selected' if user.primary_use_case == 'technical_writing' else '' }}>Technical Writing</option>
                  <option value="editing_feedback" {{ 'selected' if user.primary_use_case == 'editing_feedback' else '' }}>Editing & Feedback</option>
                  <option value="brainstorming" {{ 'selected' if user.primary_use_case == 'brainstorming' else '' }}>Brainstorming</option>
                  <option value="other" {{ 'selected' if user.primary_use_case == 'other' else '' }}>Other</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Preferences Section -->
          <div>
            <h3 class="text-lg font-semibold text-foreground mb-4">Preferences</h3>
            <div class="space-y-4">
              <div class="flex items-center space-x-3">
                <input type="checkbox" id="receive_updates" name="receive_updates" 
                       {{ 'checked' if user.receive_updates else '' }}
                       class="w-4 h-4 text-primary bg-background border-border rounded focus:ring-primary focus:ring-2">
                <label for="receive_updates" class="text-sm text-foreground">
                  Receive updates about new features and improvements
                </label>
              </div>

              <div class="flex items-center space-x-3">
                <input type="checkbox" id="contact_for_research" name="contact_for_research" 
                       {{ 'checked' if user.contact_for_research else '' }}
                       class="w-4 h-4 text-primary bg-background border-border rounded focus:ring-primary focus:ring-2">
                <label for="contact_for_research" class="text-sm text-foreground">
                  Allow contact for research purposes
                </label>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex gap-3 pt-4">
            <button type="submit" 
                    class="flex-1 px-4 py-2 bg-primary text-primary-foreground rounded-md hover:bg-primary/90 
                           transition-colors font-medium">
              Update Profile
            </button>
            <a href="{{ url_for('auth.profile') }}" 
               class="px-4 py-2 bg-secondary text-secondary-foreground rounded-md hover:bg-gray-100 
                      transition-colors font-medium text-center">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
