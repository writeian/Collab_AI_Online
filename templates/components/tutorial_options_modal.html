<div id="tutorial-options-modal" class="tutorial-options-modal hidden" role="dialog" aria-modal="true" aria-labelledby="tutorial-options-title">
  <div class="tutorial-options-modal-backdrop" data-tutorial-modal-close aria-hidden="true"></div>
  <div class="tutorial-options-modal-content" role="document">
    <h2 id="tutorial-options-title" class="tutorial-options-modal-title">Tutorial</h2>
    <p class="text-gray-300 text-sm mb-4">Choose a tutorial to get started:</p>
    <button type="button" id="tutorial-option-full" class="tutorial-options-btn">Full Tutorial</button>
    <button type="button" id="tutorial-option-room" class="tutorial-options-btn">Room Creation Tutorial</button>
    <button type="button" id="tutorial-option-chat" class="tutorial-options-btn">Chat Pages Tutorial</button>
    <button type="button" class="tutorial-options-close" data-tutorial-modal-close>Close</button>
  </div>
</div>
