{# Tone & Length Control Component (static fetch is canonical; keep in sync with src/app/static/...) #}
<details class="mt-4">
  <summary class="cursor-pointer text-sm font-medium text-muted-foreground hover:text-foreground">
    Tone & Length
  </summary>
  <div class="mt-3 p-3 bg-muted rounded-md text-xs space-y-4">
    <div class="space-y-3">
      <div class="flex items-center justify-between gap-2">
        <span class="inline-flex items-center gap-1">
          <span class="font-medium">Style</span>
          <button type="button"
                  class="inline-flex h-4 min-w-4 shrink-0 items-center justify-center rounded-full border border-border bg-background px-0.5 text-[10px] font-semibold leading-none text-muted-foreground hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1 focus-visible:ring-offset-background"
                  title="Adjust how tough or gentle the AI's feedback is."
                  aria-label="Tip: Style — adjust how tough or gentle the AI's feedback is.">?</button>
        </span>
        <span id="critique-label" class="text-muted-foreground">Balanced</span>
      </div>
      <input id="critique-slider"
             type="range"
             min="1" max="5" step="1"
             value="3"
             class="w-full"
             aria-label="AI critique level slider">
      <div class="flex justify-between text-[11px] text-muted-foreground">
        <span>Supportive</span>
        <span>Balanced</span>
        <span>Critical</span>
      </div>
    </div>
    <div class="space-y-2 border-t border-border pt-3">
      <div class="inline-flex items-center gap-1">
        <span class="font-medium">Length</span>
        <button type="button"
                class="inline-flex h-4 min-w-4 shrink-0 items-center justify-center rounded-full border border-border bg-background px-0.5 text-[10px] font-semibold leading-none text-muted-foreground hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1 focus-visible:ring-offset-background"
                title="Short is a few bullets; Medium mixes brevity and detail; Long matches our usual full answers."
                aria-label="Tip: Length — Short is a few bullets; Medium mixes brevity and detail; Long matches our usual full answers.">?</button>
      </div>
      <div class="flex gap-2" role="group" aria-label="Response length">
        <button type="button"
                class="response-length-btn flex-1 min-h-9 box-border rounded-md border-2 px-2 py-1.5 text-[11px] font-medium bg-background shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1 focus-visible:ring-offset-background"
                data-length="short"
                aria-pressed="false">Short</button>
        <button type="button"
                class="response-length-btn flex-1 min-h-9 box-border rounded-md border-2 px-2 py-1.5 text-[11px] font-medium bg-background shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1 focus-visible:ring-offset-background"
                data-length="medium"
                aria-pressed="true">Medium</button>
        <button type="button"
                class="response-length-btn flex-1 min-h-9 box-border rounded-md border-2 px-2 py-1.5 text-[11px] font-medium bg-background shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1 focus-visible:ring-offset-background"
                data-length="long"
                aria-pressed="false">Long</button>
      </div>
    </div>
  </div>
</details>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const slider = document.getElementById('critique-slider');
    const label = document.getElementById('critique-label');
    const lengthBtns = document.querySelectorAll('.response-length-btn');
    const levelNames = ['', 'Very Supportive', 'Supportive', 'Balanced', 'Critical', 'Very Critical'];

    function getChatId() {
        const match = window.location.pathname.match(/\/chat\/(\d+)/);
        return match ? match[1] : '0';
    }

    function getCritiqueInstructions(level) {
        const instructions = {
            1: "Be warmly supportive. Praise effort and provide at most two gentle suggestions. Focus on what's working well.",
            2: "Be friendly and constructive. Balance praise with suggestions. Ask clarifying questions to understand intent.",
            3: "Be neutral and concise. Give balanced pros and cons. Provide three actionable improvements with examples.",
            4: "Be rigorous and analytical. Challenge assumptions and require evidence. Rank issues by impact.",
            5: "Act as an exacting reviewer. Insist on evidence for claims. Provide pointed, actionable edits with no fluff."
        };
        return instructions[level] || instructions[3];
    }

    function getLengthInstructions(key) {
        if (key === 'long') return '';
        const map = {
            short: 'RESPONSE LENGTH: Keep the reply very brief—only a few bullet points (at most 4–5 bullets), minimal prose, no long paragraphs or extended explanations.',
            medium: 'RESPONSE LENGTH: Use a balanced length—mix short bullets with short paragraphs where helpful; stay noticeably more concise than your longest, most thorough default answers unless the question clearly needs more depth.'
        };
        return map[key] || map.medium;
    }

    const chatId = getChatId();

    function dispatchToneState() {
        const s = document.getElementById('critique-slider');
        const level = parseInt(
            (s && s.value) || sessionStorage.getItem('chat_' + chatId + '_critique') || '3',
            10
        );
        const responseLength = sessionStorage.getItem('chat_' + chatId + '_response_length') || 'medium';
        document.dispatchEvent(new CustomEvent('tone:change', {
            detail: { level: level, responseLength: responseLength }
        }));
    }

    function syncLengthButtons(activeKey) {
        lengthBtns.forEach(function(btn) {
            const on = btn.getAttribute('data-length') === activeKey;
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            btn.classList.toggle('border-blue-600', on);
            btn.classList.toggle('bg-blue-100', on);
            btn.classList.toggle('text-blue-900', on);
            btn.classList.toggle('dark:border-blue-400', on);
            btn.classList.toggle('dark:bg-blue-950/55', on);
            btn.classList.toggle('dark:text-blue-100', on);
            btn.classList.toggle('font-semibold', on);
            btn.classList.toggle('shadow-md', on);
            btn.classList.toggle('border-border', !on);
            btn.classList.toggle('bg-background', !on);
            btn.classList.toggle('text-muted-foreground', !on);
            btn.classList.toggle('font-medium', !on);
            btn.classList.toggle('shadow-sm', !on);
        });
    }

    function applyResponseLength(key) {
        try {
            sessionStorage.setItem('chat_' + chatId + '_response_length', key);
        } catch (e) {
            console.warn('response length persist failed:', e);
        }
        syncLengthButtons(key);
        dispatchToneState();
    }

    function applyCritiqueLevel(level) {
        try {
            sessionStorage.setItem('chat_' + chatId + '_critique', String(level));
        } catch (e) {
            console.warn('critique persist failed:', e);
        }
        dispatchToneState();
    }

    var initialLen = sessionStorage.getItem('chat_' + chatId + '_response_length') || 'medium';
    if (initialLen !== 'short' && initialLen !== 'medium' && initialLen !== 'long') {
        initialLen = 'medium';
    }
    try {
        sessionStorage.setItem('chat_' + chatId + '_response_length', initialLen);
    } catch (e) { /* ignore */ }
    syncLengthButtons(initialLen);

    lengthBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
            var v = btn.getAttribute('data-length');
            if (v) applyResponseLength(v);
        });
    });

    if (slider && label) {
        slider.addEventListener('input', function() {
            const level = parseInt(this.value, 10);
            label.textContent = levelNames[level] || 'Balanced';
            applyCritiqueLevel(level);
        });
        const savedLevel = sessionStorage.getItem('chat_' + chatId + '_critique');
        if (savedLevel) {
            const level = parseInt(savedLevel, 10);
            slider.value = level;
            label.textContent = levelNames[level] || 'Balanced';
            applyCritiqueLevel(level);
        } else {
            dispatchToneState();
        }
    } else {
        dispatchToneState();
    }

    const forms = document.querySelectorAll('form[method="POST"]');
    forms.forEach(function(form) {
        const contentField = form.querySelector('textarea[name="content"]');
        if (contentField) {
            form.addEventListener('submit', function() {
                const cid = getChatId();
                const level = sessionStorage.getItem('chat_' + cid + '_critique') || '3';
                const lenKey = sessionStorage.getItem('chat_' + cid + '_response_length') || 'medium';
                var hiddenInput = form.querySelector('#critique-instructions-input');
                if (!hiddenInput) {
                    hiddenInput = document.createElement('input');
                    hiddenInput.type = 'hidden';
                    hiddenInput.name = 'room81_critique_instructions';
                    hiddenInput.id = 'critique-instructions-input';
                    form.appendChild(hiddenInput);
                }
                hiddenInput.value = getCritiqueInstructions(parseInt(level, 10));
                var lengthInput = form.querySelector('#response-length-instructions-input');
                if (!lengthInput) {
                    lengthInput = document.createElement('input');
                    lengthInput.type = 'hidden';
                    lengthInput.name = 'room81_response_length_instructions';
                    lengthInput.id = 'response-length-instructions-input';
                    form.appendChild(lengthInput);
                }
                lengthInput.value = getLengthInstructions(lenKey);
            }, true);
        }
    });
});
</script>
