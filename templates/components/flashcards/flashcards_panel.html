{# Flashcards Panel Component #}
{# Non-modal overlay panel for flashcard generation and study #}

<div id="flashcards-panel-backdrop" class="flashcards-panel-backdrop hidden"></div>
<div id="flashcards-panel" class="flashcards-panel hidden" role="dialog" aria-labelledby="flashcards-panel-title" aria-modal="false">
    <div class="flashcards-panel__header">
        <h2 id="flashcards-panel-title" class="flashcards-panel__title">Create your Flashcards</h2>
        <button type="button" class="flashcards-panel__close" id="flashcards-panel-close" aria-label="Close flashcards panel">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>
    </div>

    <div class="flashcards-panel__content" id="flashcards-panel-content">
        <!-- Step 1: Configuration Form -->
        <div id="flashcards-step-config" class="flashcards-step flashcards-step--active">
            <form id="flashcards-config-form" class="flashcards-config-form">
                <div class="flashcards-config-field">
                    <label for="flashcards-context-mode" class="flashcards-config-label">
                        Context to be used
                    </label>
                    <select id="flashcards-context-mode" name="context_mode" class="flashcards-config-select" required>
                        <option value="chat">Chat only</option>
                        <option value="library">Library only</option>
                        <option value="both">Chat + Library</option>
                    </select>
                </div>

                <div class="flashcards-config-field">
                    <label for="flashcards-display-mode" class="flashcards-config-label">
                        Display mode
                    </label>
                    <select id="flashcards-display-mode" name="display_mode" class="flashcards-config-select" required>
                        <option value="grid">Grid view</option>
                        <option value="single">Single card</option>
                    </select>
                </div>

                <div id="flashcards-grid-size-field" class="flashcards-config-field">
                    <label for="flashcards-grid-size" class="flashcards-config-label">
                        Grid size
                    </label>
                    <select id="flashcards-grid-size" name="grid_size" class="flashcards-config-select">
                        <option value="1x2">1×2 (2 cards)</option>
                        <option value="2x2">2×2 (4 cards)</option>
                        <option value="2x3" selected>2×3 (6 cards)</option>
                        <option value="3x3">3×3 (9 cards)</option>
                    </select>
                </div>

                <div id="flashcards-card-count-field" class="flashcards-config-field flashcards-config-field--hidden">
                    <label for="flashcards-card-count" class="flashcards-config-label">
                        Number of cards
                    </label>
                    <input type="number" id="flashcards-card-count" name="card_count" class="flashcards-config-input" min="1" max="50" value="10">
                </div>

                <div id="flashcards-library-section" class="flashcards-config-field flashcards-config-field--hidden">
                    <label for="flashcards-library-docs" class="flashcards-config-label">
                        Select Library Documents
                    </label>
                    <div id="flashcards-library-docs-container" class="flashcards-library-docs">
                        <div id="flashcards-library-empty" class="flashcards-library-empty">
                            <p>No documents in library.</p>
                            <input type="file" id="flashcards-library-file-input" accept=".pdf,.docx,.txt" class="hidden">
                            <button type="button" class="flashcards-library-add-btn" id="flashcards-library-add-btn">
                                Add files to Library
                            </button>
                        </div>
                        <div id="flashcards-library-list" class="flashcards-library-list hidden"></div>
                        <div id="flashcards-library-upload-status" class="flashcards-library-upload-status hidden"></div>
                    </div>
                </div>

                <div class="flashcards-config-field">
                    <label for="flashcards-instructions" class="flashcards-config-label">
                        Additional instructions (optional)
                    </label>
                    <textarea id="flashcards-instructions" name="instructions" class="flashcards-config-textarea" rows="3" placeholder="e.g., focus on key terms, include examples"></textarea>
                </div>

                <div class="flashcards-config-actions">
                    <button type="submit" class="flashcards-btn flashcards-btn--primary" id="flashcards-generate-btn">
                        Generate Flashcards
                    </button>
                </div>
            </form>
        </div>

        <!-- Step 2: Grid View -->
        <div id="flashcards-step-grid" class="flashcards-step flashcards-step--hidden">
            <div id="flashcards-grid-container" class="flashcards-grid-container"></div>
            <div class="flashcards-grid-actions">
                <button type="button" class="flashcards-btn flashcards-btn--secondary" id="flashcards-generate-more-btn">
                    Generate More
                </button>
                <button type="button" class="flashcards-btn flashcards-btn--primary" id="flashcards-close-btn">
                    Close
                </button>
            </div>
        </div>

        <!-- Step 3: Single Card View -->
        <div id="flashcards-step-single" class="flashcards-step flashcards-step--hidden">
            <div class="flashcards-single-header">
                <span id="flashcards-single-counter">Card 1 of 0</span>
                <button type="button" class="flashcards-btn flashcards-btn--secondary" id="flashcards-generate-more-single-btn">
                    Generate More
                </button>
            </div>
            <div id="flashcards-single-container" class="flashcards-single-container"></div>
            <div class="flashcards-single-actions">
                <button type="button" class="flashcards-btn flashcards-btn--secondary" id="flashcards-next-btn">
                    Next Card
                </button>
                <button type="button" class="flashcards-btn flashcards-btn--primary" id="flashcards-close-single-btn">
                    Close
                </button>
            </div>
        </div>

        <!-- Loading/Error States -->
        <div id="flashcards-loading" class="flashcards-loading hidden">
            <div class="flashcards-loading-spinner"></div>
            <p id="flashcards-loading-text">Generating flashcards...</p>
        </div>

        <div id="flashcards-error" class="flashcards-error hidden">
            <div class="flashcards-error-icon">⚠️</div>
            <p id="flashcards-error-text"></p>
            <button type="button" class="flashcards-btn flashcards-btn--primary" id="flashcards-error-retry">
                Retry
            </button>
        </div>
    </div>
</div>
